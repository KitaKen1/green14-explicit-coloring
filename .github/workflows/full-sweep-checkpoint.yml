name: Test continuation across GitHub-hosted runners
on:
  push:
    branches: [green14-full-verification]
    paths:
      - verification/full-sweep/checkpoint/pilot.py
permissions:
  contents: read
jobs:
  save:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install QEMU and the minimal guest tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-system-x86 busybox-static cpio
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          ls -l /dev/kvm
      - name: Boot a guest and save its running state
        run: python3 verification/full-sweep/checkpoint/pilot.py save
      - uses: actions/upload-artifact@v4
        with:
          name: checkpoint-pilot
          path: checkpoint-data/
          compression-level: 1
  resume:
    needs: save
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: checkpoint-pilot
          path: checkpoint-data
      - name: Install the same QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-system-x86
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          ls -l /dev/kvm
      - name: Resume the same in-memory computation on a second runner
        run: python3 verification/full-sweep/checkpoint/pilot.py resume
