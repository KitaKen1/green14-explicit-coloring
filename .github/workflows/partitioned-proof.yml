name: Check the sealed fixed proof by independent partitions
on:
  push:
    branches: [green14-full-verification]
    paths:
      - verification/full-sweep/partition-request.json
permissions:
  actions: read
  contents: read
defaults:
  run:
    shell: bash
    working-directory: verification/full-sweep
jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      cases: ${{ steps.plan.outputs.cases }}
      full: ${{ steps.plan.outputs.full }}
      reused: ${{ steps.plan.outputs.reused }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: verification/full-sweep/partitioned
      - uses: actions/cache/restore@v4
        with:
          key: green14-full-v1-${{ hashFiles('verification/full-sweep/lean-toolchain','verification/full-sweep/lake-manifest.json','verification/full-sweep/full-plan.json') }}
          path: |
            ~/.elan
            verification/full-sweep/.lake/packages/*/.lake/build/lib/lean
          fail-on-cache-miss: true
      - name: Pin the original assembly and every partition
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          request=replay-request.json
          id=$(jq -r '.artifact' "$request")
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" |
            jq -e --slurpfile request "$request" '
              .name == "unconditional-exports" and .expired == false and
              .workflow_run.id == $request[0].run and
              .workflow_run.head_sha == $request[0].proof_commit and
              .digest == ("sha256:" + $request[0].original_zip_sha256)'
          echo "run_id=$(jq -r .run "$request")" >> "$GITHUB_OUTPUT"
          echo "full=$(jq -r .full partition-request.json)" >> "$GITHUB_OUTPUT"
          if jq -e '.reuse != null' partition-request.json >/dev/null; then
            cases=$(python3 partitioned/reuse.py snapshot partition-request.json proof-reuse)
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            count=$(PYTHONPATH=partitioned python3 -c 'from slices import PARTITION_COUNT; print(PARTITION_COUNT)')
            cases=$(jq -ce --argjson count "$count" '
              if .full then ["structure"] + [range($count) | tostring]
              else ["structure", "0", "172"] end' partition-request.json)
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi
          echo "cases=$cases" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.reused == 'true'
        with:
          name: reused-proof-receipts
          path: verification/full-sweep/proof-reuse/
      - uses: actions/download-artifact@v4
        with:
          name: unconditional-exports
          run-id: ${{ steps.plan.outputs.run_id }}
          github-token: ${{ github.token }}
          path: verification/full-sweep
      - name: Compare and index the exact original exports
        run: |
          set -o pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          tar -xzf inputs.tar.gz
          sha256sum -c compared.sha256
          lean --run partitioned/ReplayIndex.lean out/Challenge.ndjson out/Solution.ndjson comparator.json full-plan.json dependencies.ndjson | tee compare.log
          tar -czf partition-inputs.tar.gz out/Solution.ndjson dependencies.ndjson
          sha256sum partition-inputs.tar.gz > partition-inputs.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-export-index
          path: |
            verification/full-sweep/partition-inputs.tar.gz
            verification/full-sweep/partition-inputs.sha256
            verification/full-sweep/compared.sha256
            verification/full-sweep/compare.log
          compression-level: 0
  verify:
    needs: index
    if: needs.index.outputs.cases != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        case: ${{ fromJSON(needs.index.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: verification/full-sweep/partitioned
      - uses: actions/cache/restore@v4
        with:
          key: green14-full-v1-${{ hashFiles('verification/full-sweep/lean-toolchain','verification/full-sweep/lake-manifest.json','verification/full-sweep/full-plan.json') }}
          path: |
            ~/.elan
            verification/full-sweep/.lake/packages/*/.lake/build/lib/lean
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: sealed-export-index
          path: verification/full-sweep
      - name: Set up the Linux isolation
        run: bash sandbox.sh
      - name: Check the original proof terms in this partition
        env:
          PARTITION: ${{ matrix.case }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          reused=$(python3 partitioned/reuse.py latest partition-request.json partition-receipt "$PARTITION")
          if [[ "$reused" == true ]]; then
            echo "Reused an accepted check of the same partition from the earlier run."
            exit 0
          fi
          sha256sum -c partition-inputs.sha256
          tar -xzf partition-inputs.tar.gz
          bash replay-memory.sh
          python3 partitioned/check.py "$PARTITION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partition-${{ matrix.case }}
          path: verification/full-sweep/partition-receipt/
  join:
    needs: [index, verify]
    if: >-
      ${{ !cancelled() && needs.index.result == 'success' && needs.index.outputs.full == 'true' &&
          (needs.verify.result == 'success' || needs.index.outputs.cases == '[]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: verification/full-sweep/partitioned
      - uses: actions/download-artifact@v4
        if: needs.index.outputs.cases != '[]'
        with:
          pattern: partition-*
          path: verification/full-sweep/partitions/
      - uses: actions/download-artifact@v4
        if: needs.index.outputs.reused == 'true'
        with:
          name: reused-proof-receipts
          path: verification/full-sweep/proof-reuse/
      - name: Check that every structural assumption has a proof
        env:
          REUSED: ${{ needs.index.outputs.reused }}
        run: |
          set -o pipefail
          mkdir -p partitions
          if [[ "$REUSED" == true ]]; then python3 partitioned/reuse.py install proof-reuse partitions; fi
          python3 partitioned/join.py partitions | tee partitioned-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-partitioned-proof
          path: verification/full-sweep/partitioned-proof.json
