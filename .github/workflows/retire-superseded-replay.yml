name: Stop the superseded four-worker proof replay
on:
  push:
    branches: [green14-full-verification]
    paths:
      - .github/workflows/retire-superseded-replay.yml
permissions:
  actions: write
jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/45355093739"
          state=$(gh api "$endpoint" | jq -r -e '
            select(.head_branch == "green14-full-verification" and
                   .head_sha == "51af941e0f3045db05541128fea76f73393fcd90") | .status')
          if [[ "$state" != completed ]]; then
            gh api -X POST "$endpoint/cancel"
          fi
